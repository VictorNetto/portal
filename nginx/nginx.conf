# Reverse proxy for the Red Team Portal.
#
# This nginx container is the ONLY service exposed to the network. It routes
# incoming requests to the right internal container based on the URL path:
#   /api/*  -> the FastAPI backend (service name "api")
#   /*      -> the frontend (service name "web")
# The backend, db, and minio containers publish no ports; only nginx reaches
# them, over Docker's private network, by their Compose service names.
#
# For local dev this listens on plain HTTP (port 80). On the server we add a
# second server block listening on 443 with the org PKI certificate
# (see docs/DEPLOYMENT.md §3) and redirect 80 -> 443.

events {}

http {
    # Let uploads up to 100 MB through. nginx defaults to 1 MB, which would
    # reject attachment/evidence uploads with a confusing 413 error.
    client_max_body_size 100m;

    # Docker's internal DNS, so "api" / "web" resolve to the running containers.
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name _;  # accept any host for local dev

        # --- API: strip nothing, forward /api/* to the backend ---
        location /api/ {
            proxy_pass http://api:8000/;   # trailing slash: /api/health -> /health

            # Preserve the real client identity for the backend's audit log
            # (SPEC D8 records IP addresses). Without these, every request
            # would look like it came from nginx.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Everything else: the frontend (Vite dev server on :5173) ---
        location / {
            proxy_pass http://web:5173;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Vite HMR uses a websocket; allow the connection upgrade.
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
