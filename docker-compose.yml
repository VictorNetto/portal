# Development stack for the Red Team Operations Platform.
#
# `docker compose up` builds and starts every service below on a shared private
# network. Only nginx publishes a port to your host; everything else is reached
# internally by service name (db, api, minio, web). This mirrors production —
# the server uses the same topology, differing mainly in the nginx TLS config.
#
# Usage:
#   cp .env.example .env     (once)
#   docker compose up        (build + run; add -d to run in the background)
#   docker compose down      (stop)

services:
  # --- PostgreSQL: application database ---
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data   # named volume: data survives restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- MinIO: S3-compatible object storage for attachments/evidence ---
  # TEMPORARILY DISABLED: the org Docker proxy blocks non-official Hub
  # namespaces (minio/*). Re-enable once minio/minio is allowlisted (or an
  # approved internal mirror is available). See docs/DEPLOYMENT.md.
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  #     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  #   volumes:
  #     - minio-data:/data
  #   healthcheck:
  #     test: ["CMD", "mc", "ready", "local"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10
  #   restart: unless-stopped

  # --- API: FastAPI backend ---
  api:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend/app:/app/app   # live-reload: edit code on Windows, see it instantly
    depends_on:
      db:
        condition: service_healthy
      # minio:                    # re-enable with the minio service above
      #   condition: service_healthy
    restart: unless-stopped

  # --- Web: Vue frontend via Vite dev server (hot-reload) ---
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app          # live source: edit on Windows, HMR in browser
      - /app/node_modules        # keep container's installed deps (not host's)
    restart: unless-stopped

  # --- nginx: reverse proxy, the only service exposed to the host ---
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"   # reach the app at http://localhost:8080 during dev
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  db-data:
  # minio-data:   # re-enable with the minio service
