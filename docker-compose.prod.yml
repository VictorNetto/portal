# Production stack for the Red Team Operations Platform (docs/DEPLOYMENT.md).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production build
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm api alembic upgrade head
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Differences from the development stack: images are built (no source mounts, no
# hot reload), the API runs as a non-root user with several workers, the frontend
# is static files, nginx terminates TLS, and every service restarts on failure.
# Only nginx publishes ports; db/api/web are reachable only on the private network.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file: ${PORTAL_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
    volumes:
      - attachments-data:/data/attachments   # uploaded files (STORAGE_BACKEND=local) — back this up too
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${PORTAL_HTTP_PORT:-80}:80"
      - "${PORTAL_HTTPS_PORT:-443}:443"
    environment:
      PORTAL_SERVER_NAME: ${PORTAL_SERVER_NAME:-_}
      # Only needed when HTTPS is not on 443 (e.g. ":8443"); empty otherwise.
      PORTAL_PORT_SUFFIX: ${PORTAL_PORT_SUFFIX:-}
      NGINX_ENVSUBST_FILTER: PORTAL_
    volumes:
      - ./nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${PORTAL_CERT_DIR:-./certs}:/etc/nginx/certs:ro   # fullchain.pem + privkey.pem
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  db-data:
  attachments-data:
