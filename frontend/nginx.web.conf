# Static file server inside the `web` container (the public reverse proxy is
# separate: nginx/prod.conf.template). Single-page app: unknown paths fall back to
# index.html so deep links like /reports/<id> load and the router takes over.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Hashed build output never changes: cache it for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry point must always be revalidated so a new release is picked up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
