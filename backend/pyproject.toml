[project]
name = "redteam-portal-backend"
version = "0.1.0"
description = "Red Team Operations Platform — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "bcrypt>=4.2",
    "pyjwt>=2.10",
    "python-multipart>=0.0.12",
    "minio>=7.2",
    "reportlab>=4.2",
    "pillow>=10.3",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "pypdf>=5.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",   # FastAPI's Depends(...) as a default argument is the intended idiom
    "E501",   # line length is a formatter concern; long strings/SQL are fine
    "UP042",  # keep (str, enum.Enum): the enums are stored in PostgreSQL enum types
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702", "E731"]   # terse one-liners are fine in tests
